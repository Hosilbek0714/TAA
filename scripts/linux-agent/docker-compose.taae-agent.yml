# =============================================================================
# TAAE Agent 2 — docker-compose overlay
# -----------------------------------------------------------------------------
# Asosiy docker-compose.yml ustiga qo'shimcha (overlay) sifatida ishlatiladi.
# Foydalanish:
#   docker compose \
#     -f docker-compose.yml \
#     -f scripts/linux-agent/docker-compose.taae-agent.yml \
#     up -d
# =============================================================================

services:
  taae-agent-linux:
    build:
      context: ../..
      dockerfile: scripts/linux-agent/Dockerfile
    image: taae/agent2:linux-latest
    container_name: taae-agent-linux
    environment:
      # Konteyner ichidagi agent uchun atrof-muhit o'zgaruvchilari
      # (kerak bo'lsa, configga env-substitution orqali bog'lanadi)
      TAAE_HOSTNAME: "taae-linux-agent-01"
      TAAE_SERVER: "taae-server"
    ports:
      # Hostda 10053 -> konteynerda 10050 (Windows agenti bilan to'qnashmaslik uchun)
      - "10053:10050"
    networks:
      - taae-network
    restart: unless-stopped

networks:
  # Asosiy compose faylida e'lon qilingan tarmoqdan foydalanish
  taae-network:
    external: true
