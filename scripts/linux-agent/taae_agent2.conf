# =============================================================================
# TAAE Agent 2 Konfiguratsiya Fayli (Linux varianti)
# -----------------------------------------------------------------------------
# Ushbu fayl TAAE monitoring tizimi agenti uchun maxsus tayyorlangan.
# FHS standartiga muvofiq yo'llar ishlatiladi (/etc, /var/log, /var/run, ...).
# =============================================================================

# =========================
# UMUMIY SOZLAMALAR
# =========================

# Agent daemon PID fayli (systemd RuntimeDirectory ostida)
PidFile=/var/run/taae/agent/taae_agent2.pid

# Log turi (systemd ostida ishlatganda 'file' tavsiya etiladi;
# 'system' qilsangiz journald'ga yoziladi)
LogType=file
LogFile=/var/log/taae/agent/taae_agent2.log
LogFileSize=10

# Debug darajasi (0-5, 3 - standart)
DebugLevel=3

# Agent 2 uchun Control Socket (Linuxda Unix socket; Windows Named Pipe emas)
ControlSocket=/var/run/taae/agent/agent.sock

# =========================
# SERVER ULANISHI
# =========================

# TAAE Server manzili (Passive checks) — placeholder, IPni o'zgartiring
Server=127.0.0.1

# TAAE Server manzili (Active checks)
ServerActive=127.0.0.1:10051

# =========================
# AGENT IDENTIFIKATSIYASI
# =========================

# Hostname — Serverdagi host nomi bilan bir xil bo'lishi shart
Hostname=taae-linux-agent-01

# =========================
# AGENT LISTENING
# =========================

# Agent tinglash porti (Passive checks uchun)
ListenPort=10050

# Barcha tarmoq interfeyslarini tinglash
ListenIP=0.0.0.0

# =========================
# XAVFSIZLIK VA TIMEOUT
# =========================

# Masofadan buyruq bajarishga ruxsat (ishlab chiqarishda cheklang!)
AllowKey=system.run[*]
Plugins.SystemRun.LogRemoteCommands=1

# Umumiy timeout (sekundda)
Timeout=30

# =========================
# PLUGINS & INCLUDES
# =========================

# Qo'shimcha konfiguratsiyalar uchun yo'l (drop-in fayllar)
Include=/etc/taae/agent/taae_agent2.d/*.conf

# =========================
# USER PARAMETERS
# =========================

# Maxsus metrikalar (Masalan: taae.custom.ping)
UserParameter=taae.custom.ping,/bin/echo 1

# Faol cheklarni qayta yuklash davriyligi (sekund)
RefreshActiveChecks=10

# =========================
# TLS (placeholder)
# =========================

# TAAE serveriga ulanishda shifrlash rejimi.
# Ishlab chiqarishda 'psk' yoki 'cert' ga o'zgartirish tavsiya etiladi.
TLSConnect=unencrypted
TLSAccept=unencrypted

# --- PSK misoli (kerak bo'lsa, izohlardan chiqaring) ---
#TLSConnect=psk
#TLSAccept=psk
#TLSPSKIdentity=taae-linux-agent-01
#TLSPSKFile=/etc/taae/agent/taae_agent2.psk
