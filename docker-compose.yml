services:
  taae-db:
    image: postgres:15
    container_name: taae-db
    environment:
      POSTGRES_USER: taae
      POSTGRES_PASSWORD: taae_password
      POSTGRES_DB: taae
    ports:
      - "5433:5432"
    volumes:
      - taae-db-data:/var/lib/postgresql/data
      - ./taae_database_backup_utf8.sql:/docker-entrypoint-initdb.d/01-restore.sql
      - ./02-rebrand-taae.sql:/docker-entrypoint-initdb.d/02-rebrand-taae.sql
      - ./03-taae-full-rebrand.sql:/docker-entrypoint-initdb.d/03-taae-full-rebrand.sql
    networks:
      - taae-network
    restart: unless-stopped

  taae-server:
    image: taae/server:custom
    build:
      context: .
      dockerfile: docker/taae-server.Dockerfile
    container_name: taae-server
    env_file:
      - .env
    environment:
      DB_SERVER_HOST: taae-db
      POSTGRES_USER: taae
      POSTGRES_PASSWORD: taae_password
      POSTGRES_DB: taae
      ZBX_STARTPOLLERS: "5"
      ZBX_STARTPOLLERSUNREACHABLE: "1"
      ZBX_STARTTRAPPERS: "5"
      ZBX_STARTPINGERS: "1"
      ZBX_STARTDISCOVERERS: "1"
    ports:
      - "10051:10051"
    volumes:
      - taae-audit:/var/lib/taae
      - taae-logs:/var/log/taae
    depends_on:
      - taae-db
    networks:
      - taae-network
    restart: unless-stopped

  # TAAE Agent2 - Monitoring agent
  taae-agent:
    image: taae/agent2:custom
    build:
      context: .
      dockerfile: docker/taae-agent.Dockerfile
    container_name: taae-agent
    environment:
      ZBX_HOSTNAME: "TAAE serveri"
      ZBX_SERVER_HOST: "taae-server"
      ZBX_SERVER_PORT: "10051"
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_DEBUGLEVEL: "3"
      ZBX_TIMEOUT: "30"
      ZBX_ENABLEREMOTECOMMANDS: "1"
      ZBX_LOGREMOTECOMMANDS: "1"
    ports:
      - "10050:10050"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - taae-server
    networks:
      - taae-network
    privileged: true
    restart: unless-stopped

  # Ikkinchi TAAE Agent - Boshqa server yoki resurs uchun
  taae-agent-2:
    image: taae/agent2:custom
    build:
      context: .
      dockerfile: docker/taae-agent.Dockerfile
    container_name: taae-agent-2
    environment:
      ZBX_HOSTNAME: "Ikkinchi Server"
      ZBX_SERVER_HOST: "taae-server"
      ZBX_SERVER_PORT: "10051"
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_DEBUGLEVEL: "3"
    ports:
      - "10052:10050"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      - taae-agent
    networks:
      - taae-network
    restart: unless-stopped

  taae-web:
    image: taae-web:custom
    build:
      context: .
    container_name: taae-web
    environment:
      ZBX_SERVER_NAME: "TAAE monitoring tizimi"
      ZBX_DEFAULT_LANG: "uz_UZ"
      ZBX_SERVER_HOST: taae-server
      DB_SERVER_HOST: taae-db
      POSTGRES_USER: taae
      POSTGRES_PASSWORD: taae_password
      POSTGRES_DB: taae
      # PHP-FPM uchun:
      PHP_FPM_PM: "dynamic"
      PHP_FPM_PM_MAX_CHILDREN: "50"
      PHP_FPM_PM_START_SERVERS: "5"
      PHP_FPM_PM_MIN_SPARE_SERVERS: "5"
      PHP_FPM_PM_MAX_SPARE_SERVERS: "35"
      PHP_FPM_PM_MAX_REQUESTS: "0"
      # TAAE uchun:
      ZBX_MAXEXECUTIONTIME: "300"
      ZBX_MEMORYLIMIT: "128M"
      ZBX_POSTMAXSIZE: "16M"
      ZBX_UPLOADMAXFILESIZE: "2M"
      ZBX_MAXINPUTTIME: "300"
      PHP_TZ: "Asia/Tashkent"
      EXPOSE_WEB_SERVER_INFO: "false"

    ports:
      - "8098:8080"
    depends_on:
      - taae-server
      - taae-db
      - taae-agent
    # PHP fayllar bu yerda ULANMAYDI (volume) - ular Dockerfile'da COPY qilinib,
    # rebrending skriptidan o'tadi. Volume ularni asl nusxa bilan bosib qo'yardi.
    volumes:
      - ./ui/local/img/favicon.ico:/usr/share/zabbix/favicon.ico:ro
    networks:
      - taae-network
    restart: unless-stopped

volumes:
  taae-db-data:
  taae-audit:
  taae-logs:

networks:
  taae-network:
    driver: bridge
