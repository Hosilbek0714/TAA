services:
  taa-db:
    image: postgres:15
    container_name: taa-db
    environment:
      POSTGRES_USER: taa
      POSTGRES_PASSWORD: taa_password
      POSTGRES_DB: taa
    ports:
      - "5433:5432"
    volumes:
      - taa-db-data:/var/lib/postgresql/data
      - ./taa_database_backup_utf8.sql:/docker-entrypoint-initdb.d/01-restore.sql
      - ./02-rebrand-taa.sql:/docker-entrypoint-initdb.d/02-rebrand-taa.sql
      - ./03-taa-full-rebrand.sql:/docker-entrypoint-initdb.d/03-taa-full-rebrand.sql
    networks:
      - taa-network
    restart: unless-stopped

  taa-server:
    image: taa/server:custom
    build:
      context: .
      dockerfile: docker/taa-server.Dockerfile
    container_name: taa-server
    env_file:
      - .env
    environment:
      DB_SERVER_HOST: taa-db
      POSTGRES_USER: taa
      POSTGRES_PASSWORD: taa_password
      POSTGRES_DB: taa
      ZBX_STARTPOLLERS: "5"
      ZBX_STARTPOLLERSUNREACHABLE: "1"
      ZBX_STARTTRAPPERS: "5"
      ZBX_STARTPINGERS: "1"
      ZBX_STARTDISCOVERERS: "1"
    ports:
      - "10051:10051"
    volumes:
      - taa-audit:/var/lib/taa
      - taa-logs:/var/log/taa
    depends_on:
      - taa-db
    networks:
      - taa-network
    restart: unless-stopped

  # TAA Agent2 - Monitoring agent
  taa-agent:
    image: taa/agent2:custom
    build:
      context: .
      dockerfile: docker/taa-agent.Dockerfile
    container_name: taa-agent
    environment:
      ZBX_HOSTNAME: "TAA serveri"
      ZBX_SERVER_HOST: "taa-server"
      ZBX_SERVER_PORT: "10051"
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_DEBUGLEVEL: "3"
      ZBX_TIMEOUT: "30"
      ZBX_ENABLEREMOTECOMMANDS: "1"
      ZBX_LOGREMOTECOMMANDS: "1"
    ports:
      - "10050:10050"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - taa-server
    networks:
      - taa-network
    privileged: true
    restart: unless-stopped

  # Ikkinchi TAA Agent - Boshqa server yoki resurs uchun
  taa-agent-2:
    image: taa/agent2:custom
    build:
      context: .
      dockerfile: docker/taa-agent.Dockerfile
    container_name: taa-agent-2
    environment:
      ZBX_HOSTNAME: "Ikkinchi Server"
      ZBX_SERVER_HOST: "taa-server"
      ZBX_SERVER_PORT: "10051"
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_DEBUGLEVEL: "3"
    ports:
      - "10052:10050"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      - taa-agent
    networks:
      - taa-network
    restart: unless-stopped

  taa-web:
    image: taa-web:custom
    build:
      context: .
    container_name: taa-web
    environment:
      ZBX_SERVER_NAME: "TAA Monitor Tizimi"
      ZBX_DEFAULT_LANG: "uz_UZ"
      ZBX_SERVER_HOST: taa-server
      DB_SERVER_HOST: taa-db
      POSTGRES_USER: taa
      POSTGRES_PASSWORD: taa_password
      POSTGRES_DB: taa
      # PHP-FPM uchun:
      PHP_FPM_PM: "dynamic"
      PHP_FPM_PM_MAX_CHILDREN: "50"
      PHP_FPM_PM_START_SERVERS: "5"
      PHP_FPM_PM_MIN_SPARE_SERVERS: "5"
      PHP_FPM_PM_MAX_SPARE_SERVERS: "35"
      PHP_FPM_PM_MAX_REQUESTS: "0"
      # TAA uchun:
      ZBX_MAXEXECUTIONTIME: "300"
      ZBX_MEMORYLIMIT: "128M"
      ZBX_POSTMAXSIZE: "16M"
      ZBX_UPLOADMAXFILESIZE: "2M"
      ZBX_MAXINPUTTIME: "300"
      PHP_TZ: "Asia/Tashkent"
      EXPOSE_WEB_SERVER_INFO: "false"

    ports:
      - "8098:8080"
    depends_on:
      - taa-server
      - taa-db
      - taa-agent
    # PHP fayllar bu yerda ULANMAYDI (volume) - ular Dockerfile'da COPY qilinib,
    # rebrending skriptidan o'tadi. Volume ularni asl nusxa bilan bosib qo'yardi.
    volumes:
      - ./ui/local/img/favicon.ico:/usr/share/zabbix/favicon.ico:ro
    networks:
      - taa-network
    restart: unless-stopped

volumes:
  taa-db-data:
  taa-audit:
  taa-logs:

networks:
  taa-network:
    driver: bridge
