# TAAE Agent 2 Konfiguratsiya Fayli
# Ushbu fayl TAAE monitoring tizimi agenti uchun maxsus tayyorlangan

# =========================
# UMUMIY SOZLAMALAR
# =========================

# Agent daemon PID fayli (Windows uchun D diskda)
#PidFile=D:\TAAE\zoddix\taae_agent2.pid

# Log turi (Service sifatida ishlatganda 'file' tavsiya etiladi)
LogType=file
LogFile=D:\TAAE\zoddix\logs\taae_agent2.log
LogFileSize=10

# Debug darajasi (0-5, 3 - standart)
DebugLevel=3

# Agent 2 uchun Control Socket (Windows Named Pipe)
ControlSocket=\\.\pipe\taae_agent2.obj

# =========================
# SERVER ULANISHI
# =========================

# TAAE Server manzili (Passive checks)
# Agar serveringiz IP manzili boshqa bo'lsa, o'shani yozing
Server=127.0.0.1

# TAAE Server manzili (Active checks)
ServerActive=127.0.0.1:10051

# =========================
# AGENT IDENTIFIKATSIYASI
# =========================

# Hostname - Serverdagi nom bilan bir xil bo'lishi shart
Hostname=Windows-Server-01

# =========================
# AGENT LISTENING
# =========================

# Agent tinglash porti (Passive checks uchun)
ListenPort=10055

# Barcha tarmoq interfeyslarini tinglash
ListenIP=0.0.0.0

# =========================
# XAVFSIZLIK VA TIMEOUT
# =========================

# Masofadan buyruq bajarishga ruxsat (ixtiyoriy)
AllowKey=system.run[*]
Plugins.SystemRun.LogRemoteCommands=1

# Umumiy timeout (sekundda)
Timeout=30

# =========================
# PLUGINS & INCLUDES
# =========================

# Qo'shimcha konfiguratsiyalar uchun yo'l
Include=D:\TAAE\zoddix\conf\taae_agent2.d\*.conf

# =========================
# USER PARAMETERS
# =========================

# Maxsus metrikalar (Masalan: taae.custom.ping)
UserParameter=taae.custom.ping,cmd /c echo 1
# har 10 sekunda metrikani tekshirib turadi 
RefreshActiveChecks=10